# Branch/preview frontend for hoster.
#
# The SPA is built with empty VITE_* URLs, so it calls same-origin paths
# (/api/..., /auth/...). This nginx proxies those to the branch's backend
# containers by service name on the private per-branch network. One image
# therefore serves every branch, always talking to that branch's own backends.
#
# Notes:
# - resolver 127.0.0.11 is Docker's embedded DNS; combined with a variable in
#   proxy_pass it resolves backend names at request time, so nginx still starts
#   if a backend is briefly down.
# - Because proxy_pass uses a variable, the URI is not auto-appended — we pass
#   $request_uri explicitly to preserve the full path and query string.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    absolute_redirect off;
    port_in_redirect off;
    client_max_body_size 25m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Block dotfiles
    location ~ /\. { deny all; return 404; }

    # --- API routing (longest matching prefix wins) ---
    location /api/analytics/ {
        set $u http://analytics:3001;
        proxy_pass $u$request_uri;
    }
    location /api/market/ {
        set $u http://market:3002;
        proxy_pass $u$request_uri;
    }
    location /api/asset-catalog/ {
        set $u http://market:3002;
        proxy_pass $u$request_uri;
    }
    location /api/pocket-assets/ {
        set $u http://market:3002;
        proxy_pass $u$request_uri;
    }
    # Dashboard blog management -> blog service (502s if blog not in the branch topology).
    location /api/admin/posts {
        set $u http://blog:3003;
        proxy_pass $u$request_uri;
    }
    # Default: all other /api and all /auth -> core
    location /api/ {
        set $u http://core:3000;
        proxy_pass $u$request_uri;
    }
    location /auth/ {
        set $u http://core:3000;
        proxy_pass $u$request_uri;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|webmanifest)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
