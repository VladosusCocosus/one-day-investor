# ── Blog ─────────────────────────────────────────────────────────
server {
    listen 80;
    server_name blog.odinvestor.net;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Block editor from public access (protect behind auth at app level,
    # but belt-and-suspenders: block crawlers and direct hits)
    location /editor {
        # Allow only if referred from blog itself (basic protection)
        proxy_pass http://127.0.0.1:3003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;
    }

    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;
    }
}

# ── S3 public proxy (OG images via MinIO) ────────────────────────
server {
    listen 80;
    server_name s3.odinvestor.net;

    add_header X-Content-Type-Options "nosniff" always;

    location / {
        # Read-only: only allow GET and HEAD
        limit_except GET HEAD {
            deny all;
        }

        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
        proxy_hide_header x-amz-request-id;
        proxy_hide_header x-amz-id-2;
        proxy_hide_header x-amz-meta-s3cmd-attrs;
        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options "nosniff" always;
    }
}
