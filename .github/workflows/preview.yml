name: Preview (hoster)

# Per-branch preview environments via hoster.
# Opens/updates an env on every PR push; tears it down when the PR closes.
# Images are built + pushed to ghcr, then hoster (private control API on the
# server) pulls them. We reach the control API by SSHing to the server and
# cur/ing 127.0.0.1:8081, so it never has to be exposed publicly.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

env:
  IMAGE_PREFIX: ghcr.io/vladosuscocosus/odi

jobs:
  # --- Build + push the images this preview needs ---
  build:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [core, analytics, market, site, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.${{ matrix.service }}
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.event.pull_request.head.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
          # Empty VITE_* => the SPA uses same-origin relative URLs; the hoster
          # nginx config proxies them to the branch's own backends. (Ignored by
          # the non-frontend Dockerfiles.)
          build-args: |
            VITE_API_URL=
            VITE_ANALYTICS_URL=
            VITE_MARKET_URL=
            VITE_BLOG_URL=
            VITE_S3_PUBLIC_URL=
            FRONTEND_NGINX_CONF=nginx/frontend-hoster.conf

  # --- Deploy / update the branch env on hoster ---
  deploy:
    needs: build
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build deploy payload
        env:
          HEAD_REF: ${{ github.head_ref }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          BODY=$(jq -n \
            --arg branch "$HEAD_REF" \
            --arg tag    "$SHA" \
            --argjson config "$(cat hoster.json)" \
            '{branch:$branch, tag:$tag, sha:$tag, config:$config}')
          # base64 avoids any JSON-quoting issues when passing through SSH.
          echo "BODY_B64=$(printf '%s' "$BODY" | base64 -w0)" >> "$GITHUB_ENV"
      - name: Deploy to hoster via SSH
        uses: appleboy/ssh-action@v1
        env:
          BODY_B64: ${{ env.BODY_B64 }}
          HOSTER_TOKEN: ${{ secrets.HOSTER_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: BODY_B64,HOSTER_TOKEN
          script: |
            set -e
            echo "$BODY_B64" | base64 -d | curl -fsS -X POST http://127.0.0.1:8081/deploy \
              -H "Authorization: Bearer $HOSTER_TOKEN" \
              -H "Content-Type: application/json" \
              -d @-
            echo
            echo "Deployed. Current deployments:"
            curl -fsS http://127.0.0.1:8081/deployments -H "Authorization: Bearer $HOSTER_TOKEN"

  # --- Tear the branch env down when the PR closes/merges ---
  teardown:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Destroy branch env on hoster
        uses: appleboy/ssh-action@v1
        env:
          # hoster sanitizes branch names to DNS labels (feature/X-1 -> feature-x-1);
          # mirror that rule so DELETE targets the right deployment.
          BRANCH: ${{ github.head_ref }}
          HOSTER_TOKEN: ${{ secrets.HOSTER_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: BRANCH,HOSTER_TOKEN
          script: |
            set -e
            SLUG=$(printf '%s' "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed 's#[^a-z0-9]#-#g')
            echo "Tearing down branch env: $SLUG"
            curl -fsS -X DELETE "http://127.0.0.1:8081/deploy/$SLUG" \
              -H "Authorization: Bearer $HOSTER_TOKEN"
