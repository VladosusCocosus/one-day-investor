# Ghost blog — blog.odinvestor.net
#
# This is a snapshot of the server block currently live inside
# /etc/nginx/sites-enabled/app.conf on the production host. It is kept here for
# reference / reproducibility. On the server the block lives alongside the other
# odinvestor.net subdomains in app.conf; the TLS lines are managed by Certbot.
#
# nginx terminates TLS and reverse-proxies to Ghost on 127.0.0.1:2368.

server {
    server_name blog.odinvestor.net;

    # Ghost image/theme uploads can be large.
    client_max_body_size 50m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:2368;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;
    }

    listen 443 ssl;                                                    # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/core.odinvestor.net/fullchain.pem;      # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/core.odinvestor.net/privkey.pem;    # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf;                   # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;                     # managed by Certbot
}

# Note: the live config also carries a redundant `location /editor { ... }` block
# left over from the previous custom blog. It proxies to the same 127.0.0.1:2368
# and is harmless, but is omitted here as it serves no purpose under Ghost.

server {
    if ($host = blog.odinvestor.net) {
        return 301 https://$host$request_uri;
    }                                                                  # managed by Certbot

    listen 80;
    server_name blog.odinvestor.net;
    return 404;                                                        # managed by Certbot
}
