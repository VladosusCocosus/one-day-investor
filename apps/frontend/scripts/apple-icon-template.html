<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Apple touch icon — One Day Investor</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        width: 180px;
        height: 180px;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(ellipse at 30% 20%, #10b981 0%, #064e36 55%, #02281c 100%);
        border-radius: 40px;
        overflow: hidden;
        position: relative;
      }
      .halo {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at center, rgba(236, 253, 245, 0.22) 0%, transparent 55%);
        pointer-events: none;
      }
      svg.mark {
        width: 130px;
        height: 130px;
        position: relative;
        z-index: 2;
        filter: drop-shadow(0 6px 20px rgba(2, 40, 28, 0.55));
      }
    </style>
  </head>
  <body>
    <div class="halo"></div>
    <svg class="mark" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="line" x1="0" y1="1" x2="1" y2="0">
          <stop offset="0%" stop-color="#6ee7b7" />
          <stop offset="100%" stop-color="#ecfdf5" />
        </linearGradient>
        <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#6ee7b7" stop-opacity="0.55" />
          <stop offset="100%" stop-color="#6ee7b7" stop-opacity="0" />
        </linearGradient>
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="1.4" result="b" />
          <feMerge>
            <feMergeNode in="b" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>
      </defs>

      <!-- Area under the curve -->
      <path
        d="M 11 46 L 22 38 L 33 32 L 44 22 L 53 14 L 53 52 L 11 52 Z"
        fill="url(#fill)"
      />
      <!-- Ascending line -->
      <polyline
        points="11,46 22,38 33,32 44,22 53,14"
        fill="none"
        stroke="url(#line)"
        stroke-width="5"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#glow)"
      />
      <!-- Endpoint highlight -->
      <circle cx="53" cy="14" r="4" fill="#ecfdf5" />
      <circle cx="53" cy="14" r="7" fill="none" stroke="rgba(236,253,245,0.4)" stroke-width="1.5" />
    </svg>
  </body>
</html>
