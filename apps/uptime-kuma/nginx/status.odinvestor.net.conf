# Uptime Kuma status page — status.odinvestor.net
#
# Snapshot of the live server block in /etc/nginx/sites-enabled/app.conf.
# Depends on the $connection_upgrade map from websocket_upgrade.conf (conf.d).
# TLS lines are managed by Certbot. nginx reverse-proxies to Uptime Kuma on
# 127.0.0.1:3011.

server {
    server_name status.odinvestor.net;

    # Root shows the public status page; admin login remains at /dashboard
    location = / { return 302 /status/odinvestor; }

    location / {
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;   # from websocket_upgrade.conf
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl;                                                              # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/status.odinvestor.net/fullchain.pem;   # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/status.odinvestor.net/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf;                             # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;                              # managed by Certbot
}

server {
    if ($host = status.odinvestor.net) {
        return 301 https://$host$request_uri;
    }                                                                            # managed by Certbot

    listen 80;
    server_name status.odinvestor.net;
    return 404;                                                                  # managed by Certbot
}
